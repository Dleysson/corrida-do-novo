<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corrida do Novo — Circuito 2027</title>
    <link rel="icon" type="image/svg+xml" href="assets/common/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&family=Saira+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=16" />
  </head>
  <body data-page="home">
    <!-- ==================== HEADER ==================== -->
    <header class="topbar" data-screen-label="Header">
      <div class="topbar-container topbar-home">
        <a href="#inicio" class="brand-logo">
          <img class="brand-icon" src="assets/common/favicon.svg" alt="" width="34" height="34" />
          <span>Corrida do Novo</span>
          <span class="brand-badge">Circuito 2027</span>
        </a>

        <nav class="nav" aria-label="Primária">
          <a href="#informacoes">INFORMAÇÕES</a>
          <a href="#kit">KIT</a>
          <a href="#galeria">GALERIA</a>
          <a href="#regulamento">REGULAMENTO</a>
        </nav>
      </div>
    </header>

    <!-- ==================== HERO ==================== -->
    <section class="hero" id="inicio" data-screen-label="Hero">
      <div class="hero-img-wrap">
        <img
          src="assets/common/DOBRA_1.png"
          alt="Corrida do Novo Circuito 2027 — Um circuito para o povo disparar — Novo Atacarejo"
        />
      </div>
    </section>

    <!-- ==================== KIT + SELETOR DE CIDADE ==================== -->
    <section
      class="section-red section-stages"
      id="kit"
      data-screen-label="Kit + Seletor de Cidade"
    >
      <div class="kit-row" id="etapas">
        <div class="kit-card kit-card-home">
          <div class="kit-preview-frame">
            <img
              id="kit-preview-img"
              class="kit-preview-img"
              src="assets/recife/CAMISA_RECIFE.png"
              alt="Kit do corredor: camisa, medalha e número de peito"
            />
          </div>
        </div>

        <aside class="city-aside" aria-label="Selecione sua cidade">
          <div class="label">SELECIONE SUA CIDADE</div>

          <div class="city-panel">
            <button class="city-current" type="button" id="city-current-btn">
              <span class="arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6V6z" /></svg>
              </span>
              <span class="city-current-label">RECIFE</span>
            </button>

            <ul class="city-list" id="city-list"></ul>
          </div>
        </aside>
      </div>
    </section>

    <!-- ==================== HISTÓRIA ==================== -->
    <section class="story-novo" id="informacoes" data-screen-label="História">
      <div class="story-wrap">
        <div class="story-text-img">
          <img
            src="assets/common/story-text.png"
            alt="Em 2019, nossa história começou em Carpina, na Zona da Mata pernambucana, com uma loja e muita vontade de fazer diferente. Hoje são 67 lojas em Pernambuco, Paraíba e Alagoas, e sabemos que cada passo dessa caminhada foi dado ao seu lado. Por isso, a Corrida do Novo chega de um jeito diferente: agora em forma de circuito! Serão 7 cidades unidas pela energia do esporte e pela alegria de correr juntos."
          />
        </div>
        <div class="story-feature-col">
          <div class="story-photo-col">
            <img
              src="assets/common/runner-highlight.png"
              alt="Corredor Corrida do Novo"
            />
          </div>
          <div class="story-headline">
            <img
              src="assets/common/story-headline.png"
              alt="Porque esse circuito é NOVO, e é do POVO!"
            />
          </div>
        </div>
      </div>
    </section>

          <!-- Duplicate (required for seamless loop) -->
          <div class="mslide l"><img src="assets/photos/corrida-novo-01.jpg" alt="Foto da Corrida do Novo" decoding="async" /></div>
          <div class="mslide m"><img src="assets/photos/corrida-novo-02.jpg" alt="Foto da Corrida do Novo" decoding="async" /></div>
          <div class="mslide xl"><img src="assets/photos/corrida-novo-03.jpg" alt="Foto da Corrida do Novo" decoding="async" /></div>

          <div class="mslide m"><img src="assets/photos/corrida-novo-10.jpg" alt="Foto da Corrida do Novo" decoding="async" /></div>
        </div>
      </div>

      <!-- ROW 2 — scrolls left → right -->

          <!-- First set -->

    <!-- ==================== CTA REGULAMENTO ==================== -->
